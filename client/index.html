<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#dc2626" />
    <title>Feuerwehr Führerscheinverwaltung</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23dc2626'/%3E%3Cpath d='M32 12c-8 9-14 16-14 25a14 14 0 0 0 28 0c0-9-6-16-14-25zm0 33a6 6 0 0 1-6-6c0-4 3-7 6-11 3 4 6 7 6 11a6 6 0 0 1-6 6z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('fw_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
